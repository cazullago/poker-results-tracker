name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAR_OPTIONS: --no-same-owner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk PokerResults-v1.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: PokerResults-v1.1.0-debug.apk
          if-no-files-found: error

      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${GITHUB_REF#refs/tags/}" PokerResults-v1.1.0-debug.apk --title "Poker Results ${GITHUB_REF#refs/tags/}" --notes "Android test build. New in v1.1: live sessions with timer/breaks/rebuys, Stats tab, bankroll tracking, monthly goal, BB stats, JSON backup. NOTE for v1.0 users: this build has a different signing key than v1.0, so export CSV in the old app first, uninstall it, install this, then Settings > Import sessions (CSV). Future updates install in place."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
